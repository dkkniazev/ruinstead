<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17231c" />
    <title>Ruinstead</title>
    <style>
      #startup-screen{position:fixed;inset:0;z-index:2000;display:grid;place-content:center;justify-items:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center;color:#f3e4bf;background:radial-gradient(ellipse at 50% 38%,#344f43 0,#182c2a 48%,#0d1c20 100%);font:15px/1.5 system-ui,sans-serif}
      #startup-screen h1{margin:0;font:700 clamp(32px,7vw,52px)/1.2 Georgia,serif;letter-spacing:.12em;text-shadow:0 3px 8px #0006}
      #startup-screen p{margin:0;color:#c6d0be;max-width:360px}
      .startup-seal{width:86px;height:86px;filter:drop-shadow(0 5px 12px #0006)}
      .startup-progress{width:160px;height:3px;border-radius:4px;overflow:hidden;background:#81927940}
      .startup-progress::after{content:'';display:block;width:45%;height:100%;background:#d7b972;animation:startup-travel 1.5s ease-in-out infinite alternate}
      #startup-retry{padding:12px 24px;border:1px solid #ecd09a;border-radius:8px;background:#d2b373;color:#173332;font:700 15px system-ui;cursor:pointer}
      #startup-retry[hidden]{display:none}
      @keyframes startup-travel{to{transform:translateX(122%)}}
      @media(prefers-reduced-motion:reduce){.startup-progress::after{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="startup-screen" role="status" aria-live="polite">
      <svg class="startup-seal" viewBox="0 0 96 96" aria-hidden="true" fill="none">
        <path d="M48 4 83 25v46L48 92 13 71V25Z" stroke="#bfa568" stroke-width="2"/>
        <path d="M31 69V44a17 17 0 0 1 34 0v25M25 69h46M28 37l7-10h26l7 10M48 7v11M48 78v11M16 27l10 6M70 63l10 6M16 69l10-6M70 33l10-6" stroke="#dcca95" stroke-width="5" stroke-linejoin="round"/>
        <path d="m48 42 8 12-8 12-8-12Z" fill="#e0bd6c"/>
      </svg>
      <h1>RUINSTEAD</h1>
      <p id="startup-note">Загрузка мира…</p>
      <div class="startup-progress" aria-hidden="true"></div>
      <button id="startup-retry" hidden type="button">Попробовать снова</button>
    </div>
    <script>
      const initialLanguage=(new URLSearchParams(location.search).get('lang')||navigator.languages?.[0]||navigator.language||'ru').toLowerCase().split(/[-_]/)[0];
      document.documentElement.lang=initialLanguage==='en'?'en':'ru';
      if(initialLanguage==='en'){
        document.getElementById('startup-note').textContent='Loading the world…';
        document.getElementById('startup-retry').textContent='Try again';
      }
      document.getElementById('startup-retry').addEventListener('click',()=>location.reload());
      window.addEventListener('error',()=>{
        if(!document.getElementById('startup-screen'))return;
        document.getElementById('startup-note').textContent=document.documentElement.lang==='en'?'Could not load the world. Check your connection and try again.':'Не удалось загрузить мир. Проверьте соединение и попробуйте снова.';
        document.getElementById('startup-retry').hidden=false;
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
