name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ruinstead-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Gameplay, economy and world sanity
        # Release/campaign/live-device gates remain separate; see QA_RELEASE.md.
        run: |
          npm run check:docs
          npm run balance
          npm run check:world
          npm run check:gameplay
          npm run check:polish
          npm run check:regressions
          npm run check:art

      - name: Typecheck and build
        run: npm run build
